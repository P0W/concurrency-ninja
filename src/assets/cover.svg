<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concurrency Ninja — cover v4 (Mascot edition).
  Fully original mascot: "Cody the Concurrency Turtle".
  Cute chunky cartoon turtle, mid-spin, batons blurring into motion arcs.
  Original geometric design.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1330"/>
      <stop offset="55%" stop-color="#0a0e1f"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#243070" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0e1f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="shellGrad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="55%" stop-color="#4ea53a"/>
      <stop offset="100%" stop-color="#2c6622"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#cfee9c"/>
      <stop offset="100%" stop-color="#88b855"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="100%" stop-color="#e8c97a"/>
    </radialGradient>
    <linearGradient id="bandana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a45"/>
      <stop offset="100%" stop-color="#d44616"/>
    </linearGradient>
    <linearGradient id="chuck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3024"/>
      <stop offset="100%" stop-color="#1a1610"/>
    </linearGradient>
    <radialGradient id="chuckShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9a8470"/>
      <stop offset="100%" stop-color="#1a1610"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="motionBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="2400" fill="url(#bg)"/>
  <circle cx="800" cy="1500" r="700" fill="url(#spotlight)"/>

  <!-- Header -->
  <line x1="160" y1="180" x2="1440" y2="180" stroke="#2a3460" stroke-width="1.5"/>
  <text x="160"  y="158" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#5b6a8f">FIRST EDITION  ·  C++17 / C++20</text>
  <text x="1440" y="158" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#5b6a8f">VOL. 01</text>

  <!-- Title -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#f3f6ff">
    <text x="160" y="440" font-size="180" font-weight="900" letter-spacing="-7">Concurrency</text>
    <text x="160" y="640" font-size="180" font-weight="900" letter-spacing="-7">Ninja<tspan fill="#ff7a45">.</tspan></text>
  </g>
  <rect x="160" y="690" width="220" height="6" fill="#ff7a45"/>
  <text x="160" y="770" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="300" letter-spacing="2" fill="#aab5d4">A pragmatic field manual for Modern C++.</text>
  <text x="160" y="820" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="300" font-style="italic" letter-spacing="1" fill="#7a86a8">From cache lines to coroutines — without the hand-waving.</text>

  <!-- ============================================ -->
  <!-- MASCOT: Cody the Concurrency Turtle           -->
  <!-- ============================================ -->
  <g transform="translate(800,1430)">

    <!-- Motion arcs for spinning batons (behind mascot) -->
    <g fill="none" stroke="#ff9a45" stroke-width="3" opacity="0.18" filter="url(#softGlow)">
      <circle cx="-340" cy="-100" r="180"/>
      <circle cx="-340" cy="-100" r="150"/>
      <circle cx="-340" cy="-100" r="120"/>
      <circle cx="340"  cy="100"  r="180"/>
      <circle cx="340"  cy="100"  r="150"/>
      <circle cx="340"  cy="100"  r="120"/>
    </g>
    <!-- Arc-shaped motion streaks (clipped arcs) -->
    <g fill="none" stroke="#ff7a45" stroke-width="6" opacity="0.45" stroke-linecap="round">
      <path d="M -460,-100 A 180,180 0 0,1 -340,-280"/>
      <path d="M -220,-100 A 180,180 0 0,1 -340,80"/>
      <path d="M 460,100 A 180,180 0 0,1 340,280"/>
      <path d="M 220,100 A 180,180 0 0,1 340,-80"/>
    </g>

    <!-- Shell (rounded shield from behind body) -->
    <g transform="translate(0,30)">
      <ellipse cx="0" cy="0" rx="240" ry="220" fill="url(#shellGrad)" stroke="#1f4a18" stroke-width="6"/>
      <!-- Hexagonal scute pattern (very stylized, modular) -->
      <g fill="#7ed957" stroke="#1f4a18" stroke-width="3" opacity="0.92">
        <polygon points="0,-100 60,-65 60,5 0,40 -60,5 -60,-65"/>
        <polygon points="100,-30 160,5 160,75 100,110 40,75 40,5"/>
        <polygon points="-100,-30 -40,5 -40,75 -100,110 -160,75 -160,5"/>
        <polygon points="0,80 60,115 60,185 0,220 -60,185 -60,115"/>
      </g>
    </g>

    <!-- Body/torso (front of shell) -->
    <ellipse cx="0" cy="40" rx="195" ry="180" fill="url(#bodyGrad)" stroke="#3a6a18" stroke-width="5"/>
    <!-- Belly plate -->
    <ellipse cx="0" cy="80" rx="135" ry="125" fill="url(#bellyGrad)" stroke="#9a7833" stroke-width="3"/>
    <!-- Belly plate stitch lines -->
    <g stroke="#9a7833" stroke-width="2" fill="none" opacity="0.5">
      <line x1="-110" y1="40" x2="110" y2="40"/>
      <line x1="-130" y1="90" x2="130" y2="90"/>
      <line x1="-115" y1="140" x2="115" y2="140"/>
    </g>

    <!-- LEFT arm (held baton) -->
    <g transform="translate(-180,30) rotate(-25)">
      <ellipse cx="0" cy="0" rx="55" ry="40" fill="url(#bodyGrad)" stroke="#3a6a18" stroke-width="5"/>
      <!-- Wrist guard -->
      <rect x="-35" y="20" width="70" height="22" rx="6" fill="#d44616" stroke="#7a1f0a" stroke-width="3"/>
      <!-- Hand (fist) -->
      <circle cx="0" cy="60" r="32" fill="url(#bodyGrad)" stroke="#3a6a18" stroke-width="4"/>
      <!-- Held baton -->
      <rect x="-12" y="55" width="24" height="80" rx="6" fill="url(#chuckShine)" stroke="#0c0a06" stroke-width="3"/>
    </g>

    <!-- RIGHT arm (held baton) -->
    <g transform="translate(180,30) rotate(25)">
      <ellipse cx="0" cy="0" rx="55" ry="40" fill="url(#bodyGrad)" stroke="#3a6a18" stroke-width="5"/>
      <rect x="-35" y="20" width="70" height="22" rx="6" fill="#d44616" stroke="#7a1f0a" stroke-width="3"/>
      <circle cx="0" cy="60" r="32" fill="url(#bodyGrad)" stroke="#3a6a18" stroke-width="4"/>
      <!-- Held baton -->
      <rect x="-12" y="55" width="24" height="80" rx="6" fill="url(#chuckShine)" stroke="#0c0a06" stroke-width="3"/>
    </g>

    <!-- Head (sits on body, slightly forward) -->
    <g transform="translate(0,-160)">
      <ellipse cx="0" cy="0" rx="140" ry="125" fill="url(#bodyGrad)" stroke="#3a6a18" stroke-width="5"/>

      <!-- Headband (across forehead, above eyes) -->
      <rect x="-130" y="-100" width="260" height="33" fill="url(#bandana)" stroke="#7a1f0a" stroke-width="3"/>
      <!-- Headband tails streaming behind from rotation -->
      <g fill="url(#bandana)" stroke="#7a1f0a" stroke-width="3">
        <polygon points="-130,-100 -240,-125 -258,-94 -132,-68"/>
        <polygon points="-240,-125 -322,-137 -332,-108 -258,-94"/>
      </g>

      <!-- Eyes (looking forward, determined) -->
      <ellipse cx="-55" cy="-30" rx="22" ry="26" fill="#ffffff"/>
      <ellipse cx="55"  cy="-30" rx="22" ry="26" fill="#ffffff"/>
      <ellipse cx="-55" cy="-25" rx="11" ry="14" fill="#1a1a2a"/>
      <ellipse cx="55"  cy="-25" rx="11" ry="14" fill="#1a1a2a"/>
      <!-- Eye highlight -->
      <circle cx="-50" cy="-30" r="3.5" fill="#ffffff"/>
      <circle cx="60"  cy="-30" r="3.5" fill="#ffffff"/>
      <!-- Determined brows -->
      <path d="M -85,-65 L -25,-58" stroke="#1f4a18" stroke-width="5" stroke-linecap="round"/>
      <path d="M  25,-58 L  85,-65" stroke="#1f4a18" stroke-width="5" stroke-linecap="round"/>

      <!-- Mouth: confident smirk -->
      <path d="M -38,38 Q 0,62 38,38" fill="none" stroke="#1f4a18" stroke-width="5" stroke-linecap="round"/>
      <!-- Cheek blush (cute factor) -->
      <ellipse cx="-95" cy="30" rx="22" ry="10" fill="#ff9aa2" opacity="0.55"/>
      <ellipse cx="95"  cy="30" rx="22" ry="10" fill="#ff9aa2" opacity="0.55"/>
    </g>

    <!-- Feet (peeking from bottom) -->
    <g transform="translate(0,260)">
      <ellipse cx="-80" cy="0" rx="60" ry="28" fill="url(#bodyGrad)" stroke="#3a6a18" stroke-width="4"/>
      <ellipse cx="80"  cy="0" rx="60" ry="28" fill="url(#bodyGrad)" stroke="#3a6a18" stroke-width="4"/>
    </g>

  </g>

  <!-- Caption under mascot -->
  <text x="800" y="2050" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="6" fill="#ff9a45">CODY · GUARDIAN OF HAPPENS-BEFORE</text>

  <!-- Footer -->
  <line x1="160" y1="2230" x2="1440" y2="2230" stroke="#2a3460" stroke-width="1.5"/>
  <text x="160"  y="2210" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#5b6a8f">MSVC 19.3x  ·  GCC 11+  ·  Clang 13+</text>
  <text x="1440" y="2210" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#5b6a8f">standard library only</text>
  <text x="800"  y="2310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-style="italic" font-weight="300" letter-spacing="3" fill="#5b6a8f">no vendor extensions  ·  no Boost  ·  no hand-waving</text>
</svg>
